<!DOCTYPE html> 
<html lang="en"> 

<!-- 화면에 안보이는 영역 설정  -->
<head> <!-- 시작  -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>출결 관리</title>  <!-- 브라우저 탭 이름 -->
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
        <!-- 
        defer가 없으면 <script> 줄을 만난 순간 HTML 파싱을 멈추고 JS를 실행한다. 
        defer가 있으면 HTML 파싱을 끝까지 마친 다음에 JS를 실행한다.
        -->
</head> <!-- 끝 -->
<body> <!-- 시작 -->
    <p id="now-date"></p>
  <!--   <div id="t_div">의미없는 상자</div>
    <span id="t_span"></span>
    <time id="t_time"></time> -->

    <!-- 문법: <태그 id="이름표">화면에 보일 글자</태그> -->
    <button id="btn01">NMIXX</button>
    <button id="btn02">Blue</button>
    <button id="btn03">Valentine</button>
    <button id="btn04">ShapeOfLove</button>
    <button id="save-today">오늘 출석</button>
    

    

</body> <!-- 끝 -->
</html>
